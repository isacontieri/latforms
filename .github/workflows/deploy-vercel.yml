name: Deploy Vercel (Latitudes)

# A Vercel Hobby só aceita deploy automático pelo GitHub quando quem fez o commit é a dona da conta.
# Por isso o deploy de produção é disparado aqui, pela CLI, com um token da conta Latitudes, sem enviar os dados do commit.
# Roda só no repositório da empresa. Segredo: VERCEL_TOKEN. Variáveis: VERCEL_ORG_ID, VERCEL_PROJECT_ID.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-vercel-producao
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'LatitudesViagens/LatForms'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Deploy de produção (build feito pela Vercel)
        # O build roda na Vercel: as variáveis são "Sensitive" e não saem de lá (build no GitHub ficaria sem elas).
        # Sem a pasta .git a CLI não envia o autor do commit (a Vercel Hobby bloqueia autor que não é a dona da conta).
        run: |
          rm -rf .git
          URL=$(npx --yes vercel@56 deploy --prod --yes --token="$VERCEL_TOKEN")
          echo "Deploy: $URL"
          # após um rollback a Vercel para de trocar a produção sozinha; promover garante que este deploy entra no ar
          if ! saida=$(npx --yes vercel@56 promote "$URL" --yes --token="$VERCEL_TOKEN" 2>&1); then
            echo "$saida" | grep -q "already the current production deployment" || { echo "$saida"; exit 1; }
          fi
          echo "Produção: $URL"
      - name: Conferir produção
        id: conferir
        run: |
          for i in 1 2 3 4 5 6; do
            login=$(curl -s -o /dev/null -w '%{http_code}' https://latforms-latitudes.vercel.app/login)
            ficha=$(curl -s -o /dev/null -w '%{http_code}' https://latforms-latitudes.vercel.app/f/token-invalido)
            echo "login=$login f/token-invalido=$ficha"
            [ "$login" = 200 ] && [ "$ficha" = 404 ] && exit 0
            sleep 10
          done
          exit 1
      - name: Voltar ao deploy anterior se a conferência falhar
        if: failure() && steps.conferir.outcome == 'failure'
        run: npx --yes vercel@56 rollback --yes --token="$VERCEL_TOKEN" || true
